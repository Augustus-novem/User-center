server:
  name: user-center
  port: 8082
  mode: test

db:
  dsn: root:root@tcp(localhost:13316)/user_center_test?charset=utf8mb4&parseTime=True&loc=Local

redis:
  addr: localhost:6379
  password: ""
  db: 2

kafka:
  enabled: false
  brokers:
    - localhost:9092
  client_id: user-center-test
  consumer_group: user-center-worker-test


jwt:
  access_token_key: TEST-ONLY-NOT-A-SECRET-ACCESS-TOKEN-KEY
  refresh_token_key: TEST-ONLY-NOT-A-SECRET-REFRESH-TOKEN-KEY
  access_token_ttl: 15m
  refresh_token_ttl: 24h
  idle_timeout: 24h
  absolute_timeout: 168h

wechat:
  app_id: test-app-id
  app_key: TEST-ONLY-NOT-A-SECRET-WECHAT-APP-KEY
  redirect_url: http://localhost:8082/oauth2/wechat/callback
  state_cookie_name: jwt-state
  state_token_key: TEST-ONLY-NOT-A-SECRET-WECHAT-STATE-KEY
  state_token_ttl: 10m
  state_cookie_path: /oauth2/wechat/callback

cors:
  allow_credentials: true
  allow_origins:
    - http://localhost:3000
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allow_headers:
    - Content-Type
    - Authorization
    - X-Refresh-Token
  expose_headers:
    - x-jwt-token
    - x-refresh-token
  max_age: 1h

ratelimit:
  enabled: true
  prefix: ip-limiter-test
  interval: 1m
  limit: 100

log:
  level: debug
  encoding: console
  output_paths:
    - stdout
  error_output_paths:
    - stderr
  disable_caller: false
  disable_stacktrace: false
  development: true
  file:
    enabled: false
    filename: logs/user-center-test.log
    max_size: 50
    max_backups: 3
    max_age: 7
    local_time: true
    compress: false

feature:
  enable_wechat_login: false
  enable_sms_login: true
  enable_debug_log: true

feed:
  fanout_batch_size: 50
  inbox_max_items: 100
  fanout_threshold: 3

hot_rank:
  window_minutes: 5
  snapshot_ttl: 2m
  event_dedup_ttl: 24h
  publish_weight: 10
  like_weight: 3
  comment_weight: 5

search:
  enabled: false
  address: http://localhost:9200
  index: community_notes_test
  consumer_group: user-center-search-worker-test
  request_timeout: 100ms
  db_fallback_timeout: 100ms
  fallback_window: 24h
  max_limit: 10
  reindex_batch_size: 50
